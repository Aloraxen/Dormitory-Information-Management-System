<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${formTitle})"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="content">
        <div th:replace="fragments/alerts :: alerts"></div>

        <div class="page-title" th:text="${formTitle}">新增用户</div>
        <div class="page-desc">新增用户时需设置初始密码；编辑时如留空密码则表示不修改</div>

        <div class="panel">
            <div class="panel-body">
                <form th:action="@{/admin/users/save}" th:object="${user}" method="post"
                      style="max-width: 640px;">
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">登录账号 *</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">姓名 *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">
                                密码 <span th:if="${user.id != null}" class="text-muted fw-normal"
                                          style="font-size:12px;">（留空表示不修改）</span><span
                                        th:if="${user.id == null}">*</span>
                            </label>
                            <input type="password" class="form-control" th:field="*{password}"
                                   th:required="${user.id == null}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">角色 *</label>
                            <select class="form-select" th:field="*{role}" required>
                                <option value="ROLE_ADMIN">系统管理员</option>
                                <option value="ROLE_MANAGER">宿管员</option>
                                <option value="ROLE_STUDENT">学生</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">状态</label>
                            <select class="form-select" th:field="*{enabled}">
                                <option th:value="true">启用</option>
                                <option th:value="false">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
