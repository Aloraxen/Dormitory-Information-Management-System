<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav class="navbar navbar-expand topbar" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">宿舍信息管理系统</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white-50 me-3 d-none d-md-inline" style="font-size:13px;">Dormitory Information Management System</span>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDrop" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <span sec:authentication="name">当前用户</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDrop">
                        <li><span class="dropdown-item-text text-muted" style="font-size:13px;">
                            角色：<span sec:authentication="principal.authorities">角色</span>
                        </span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item text-danger">退出登录</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</html>
