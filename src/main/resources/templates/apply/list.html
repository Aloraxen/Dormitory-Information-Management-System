<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('申请处理')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="content">
        <div th:replace="fragments/alerts :: alerts"></div>

        <div class="page-title">申请处理</div>
        <div class="page-desc">处理学生提交的宿舍类型申请、调宿申请与宿舍报修</div>

        <div class="panel">
            <div class="panel-header">
                <span class="text-muted" style="font-size:13px;">共 <span th:text="${applies.size()}">0</span> 条申请</span>
            </div>
            <div class="panel-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>#</th><th>申请人</th><th>学号</th><th>类型</th><th>标题</th><th>内容</th>
                        <th>状态</th><th>申请时间</th><th>处理回复</th><th width="260">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a, iter : ${applies}">
                        <td th:text="${iter.count}">1</td>
                        <td th:text="${a.student.name}">王小明</td>
                        <td th:text="${a.student.studentNo}">2023010100</td>
                        <td th:text="${a.type}">宿舍类型申请</td>
                        <td th:text="${a.title}">标题</td>
                        <td th:text="${a.content}" style="max-width:220px;">内容</td>
                        <td>
                            <span class="badge-status"
                                  th:classappend="${a.status == '待处理'} ? 'bg-warning text-dark' : (${a.status == '已通过'} ? 'bg-success' : 'bg-danger')"
                                  th:text="${a.status}">待处理</span>
                        </td>
                        <td th:text="${#temporals.format(a.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                        <td th:text="${a.reply} ?: '—'">—</td>
                        <td>
                            <div th:if="${a.status == '待处理'}">
                                <form th:action="@{/apply/handle/{id}(id=${a.id})}" method="post"
                                      class="d-flex gap-1 mb-1">
                                    <input type="hidden" name="status" value="已通过">
                                    <input type="text" name="reply" class="form-control form-control-sm"
                                           placeholder="回复（可选）" style="width:110px;">
                                    <button type="submit" class="btn btn-sm btn-success btn-action">通过</button>
                                </form>
                                <form th:action="@{/apply/handle/{id}(id=${a.id})}" method="post"
                                      class="d-flex gap-1">
                                    <input type="hidden" name="status" value="已驳回">
                                    <input type="text" name="reply" class="form-control form-control-sm"
                                           placeholder="驳回原因（可选）" style="width:110px;">
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-action">驳回</button>
                                </form>
                            </div>
                            <form th:if="${a.status != '待处理'}"
                                  th:action="@{/apply/delete/{id}(id=${a.id})}" method="post"
                                  data-confirm="确定删除该申请记录吗？">
                                <button type="submit" class="btn btn-sm btn-outline-secondary btn-action">删除记录</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(applies)}">
                        <td colspan="10" class="text-center text-muted py-4">暂无申请记录</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
