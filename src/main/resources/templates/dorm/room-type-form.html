<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${formTitle})"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="content">
        <div th:replace="fragments/alerts :: alerts"></div>

        <div class="page-title" th:text="${formTitle}">新增房型</div>
        <div class="page-desc">带 * 为必填项</div>

        <div class="panel">
            <div class="panel-body">
                <form th:action="@{/dorm/room-types/save}" th:object="${roomType}" method="post"
                      style="max-width: 640px;">
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">房型名称 *</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">床位数 *</label>
                            <input type="number" class="form-control" th:field="*{bedCount}" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">收费标准（元/学期）</label>
                            <input type="number" class="form-control" th:field="*{price}" min="0" step="0.01">
                        </div>
                        <div class="col-12">
                            <label class="form-label">配置说明</label>
                            <textarea class="form-control" th:field="*{remark}" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/dorm/room-types}" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
