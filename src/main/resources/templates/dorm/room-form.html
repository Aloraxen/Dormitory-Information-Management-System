<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${formTitle})"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="layout">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="content">
        <div th:replace="fragments/alerts :: alerts"></div>

        <div class="page-title" th:text="${formTitle}">新增房间</div>
        <div class="page-desc">带 * 为必填项</div>

        <div class="panel">
            <div class="panel-body">
                <form th:action="@{/dorm/rooms/save}" th:object="${room}" method="post"
                      style="max-width: 640px;">
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">所属楼栋 *</label>
                            <select class="form-select" th:field="*{building.id}" required>
                                <option value="">-- 请选择 --</option>
                                <option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.name}">一号公寓</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">房型 *</label>
                            <select class="form-select" th:field="*{roomType.id}" required>
                                <option value="">-- 请选择 --</option>
                                <option th:each="t : ${roomTypes}" th:value="${t.id}"
                                        th:text="${t.name + '（' + t.bedCount + '床）'}">四人间</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">房间号 *</label>
                            <input type="text" class="form-control" th:field="*{roomNo}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">所在楼层</label>
                            <input type="number" class="form-control" th:field="*{floor}" min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">状态</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="正常">正常</option>
                                <option value="维修中">维修中</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" th:field="*{remark}" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a th:href="@{/dorm/rooms}" class="btn btn-outline-secondary">返回列表</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
